<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>记分工具 Score-Tool</title>
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="app">

  <!-- 登录/注册 -->
  <section id="view-auth" class="view">
    <h1>记分工具</h1>
    <div class="card">
      <div class="tabs">
        <button id="tab-login" class="active">登录</button>
        <button id="tab-register">注册</button>
      </div>
      <input id="auth-username" placeholder="用户名（≥2字）">
      <input id="auth-password" type="password" placeholder="密码（≥4位）">
      <input id="auth-nickname" placeholder="昵称（可选）" style="display:none">
      <button id="auth-submit" class="primary">登录</button>
      <p id="auth-msg" class="msg"></p>
    </div>
  </section>

  <!-- 首页：我的房间 -->
  <section id="view-home" class="view" style="display:none">
    <div class="topbar">
      <span id="home-user"></span>
      <button id="btn-logout" class="ghost">退出</button>
    </div>
    <h2>我的房间</h2>
    <div id="room-list" class="list"></div>

    <div class="card">
      <h3>创建房间</h3>
      <input id="create-name" placeholder="房间名（如：周五牌局）">
      <button id="btn-create" class="primary">创建</button>
    </div>
    <div class="card">
      <h3>加入房间</h3>
      <input id="join-no" placeholder="输入 6 位房间号">
      <button id="btn-join" class="primary">加入</button>
    </div>
  </section>

  <!-- 房间内 -->
  <section id="view-room" class="view" style="display:none">
    <div class="topbar">
      <button id="btn-back" class="ghost">← 返回</button>
      <span id="room-title"></span>
      <span id="room-no" class="room-no"></span>
    </div>
    <div class="tabs">
      <button id="tab-current" class="active">当前局</button>
      <button id="tab-history">历史</button>
      <button id="tab-chart">图表</button>
    </div>

    <div id="panel-current" class="panel">
      <h3>成员分数（累计收下）</h3>
      <div id="member-list" class="list"></div>
      <h3>本轮下注</h3>
      <div id="contrib-list" class="list"></div>
      <div class="actions">
        <input id="contrib-amount" type="number" min="1" inputmode="numeric" placeholder="出钱金额">
        <button id="btn-contrib" class="primary" style="width:auto;margin:0;padding:12px 18px">我出钱</button>
      </div>
      <div class="actions" style="margin-top:12px">
        <button id="btn-settle" class="win">我收下（我是赢家）</button>
        <button id="btn-cancel" class="ghost">取消本回合</button>
      </div>
    </div>

    <div id="panel-history" class="panel" style="display:none">
      <div id="history-list"></div>
    </div>

    <div id="panel-chart" class="panel" style="display:none">
      <canvas id="chart" width="340" height="300"></canvas>
      <p class="hint">x=回合序号（起=开局），y=累计收下分，每条线一个人</p>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
